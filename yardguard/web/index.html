<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YardGuard">
<title>YardGuard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="app" class="app" hidden>
  <header class="top" id="top">
    <button class="icon-btn" id="back" aria-label="Back" hidden></button>
    <div class="top-title">
      <h1 id="title">YardGuard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="icon-btn" id="menu" aria-label="Menu"></button>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="view" class="view"></main>
  <nav class="tabs" id="tabs" aria-label="Pages">
    <a href="#/cameras" data-tab="cameras"><span data-icon="camera"></span>Cameras</a>
    <a href="#/incidents" data-tab="incidents"><span data-icon="shield"></span>Incidents<i class="badge" id="badge" hidden></i></a>
    <a href="#/areas" data-tab="areas"><span data-icon="areas"></span>Areas</a>
  </nav>
</div>
<div id="pairing" hidden></div>
<noscript><p class="pair">YardGuard needs JavaScript turned on in this browser.</p></noscript>
</body>
</html>
